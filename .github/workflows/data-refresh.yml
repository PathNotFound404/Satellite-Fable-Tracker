name: data-refresh

# Fetches CelesTrak data, validates it and deploys it to production with the Vercel CLI.
# Spec and fair-use rules: docs/ci-cd.md. Data is deployed, never committed (ADR 0001).

on:
  schedule:
    # Every 6 hours at minute 23: 3x CelesTrak's 2-hour update interval, and off the
    # busy top of the hour.
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # Checked first so a missing secret can never cost a CelesTrak download.
      - name: Check configuration
        run: |
          missing=""
          [ -n "$PRODUCTION_URL" ] || missing="$missing PRODUCTION_URL(variable)"
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error title=Data refresh not configured::Missing:$missing. See docs/ci-cd.md."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Freshness guard, fetch, validate and write. Sets `status` to `fetched` or
      # `skipped`; any failure exits non-zero, so nothing below runs and production
      # keeps the last good data.
      - name: Fetch and validate
        id: fetch
        run: npm run fetch-data

      - name: Build and deploy
        if: steps.fetch.outputs.status == 'fetched'
        run: |
          npx --yes vercel@65 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@65 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@65 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Keep the data file for debugging
        if: steps.fetch.outputs.status == 'fetched'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: satellites-json
          path: public/data/satellites.json
          retention-days: 7

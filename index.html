<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Thousands of real satellites moving in real time on an interactive 3D globe."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Satellite Tracker</title>
  </head>
  <body>
    <!-- Shown until the app's script has loaded and replaced it, so the first paint
         doesn't wait for three.js to download. Inline styles: the stylesheet isn't in yet. -->
    <div id="app">
      <p
        style="
          position: fixed;
          inset: 0;
          display: grid;
          place-items: center;
          margin: 0;
          background: #000;
          color: rgb(235 235 245 / 0.62);
          font:
            14px -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            Roboto,
            sans-serif;
        "
      >
        Loading Satellite Tracker…
      </p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
